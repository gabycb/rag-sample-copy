# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: atlas-rag
metadata:
  template: azd-init

services:
  bot:
    project: ./src/bot
    language: python
    # The bot runs as a plain FastAPI app (uvicorn) on Azure App Service,
    # not on Azure Container Apps. azd zip-deploys the source and Oryx builds it.
    host: appservice
